<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Landfill</title>
<style>
:root{--ink:#111;--line:#dedede;--blue:#3157ff;--lime:#d3ff42;--paper:#fff;--muted:#777}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}button{font:inherit;color:inherit;cursor:pointer}
.site-title{position:fixed;left:26px;top:21px;z-index:10;font-weight:800;font-size:clamp(20px,2.5vw,30px);letter-spacing:-1.4px}
.page{position:absolute;inset:0;display:none;background:#fff}.page.active{display:block}
.feed-page{overflow:auto}.feed-grid{width:min(1040px,calc(100vw - 52px));margin:96px auto 70px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.post{border:1px solid var(--line);background:#fff;cursor:pointer;transition:border-color .18s,transform .18s}.post:hover{border-color:#999;transform:translateY(-2px)}.post:focus-visible{outline:2px solid #111;outline-offset:2px}.post-head{height:31px;padding:0 8px;display:flex;align-items:center;gap:7px;font-size:10px}.avatar{width:17px;height:17px;border-radius:50%;background:#dedede}.more{margin-left:auto;letter-spacing:2px}.thumb{position:relative;width:100%;aspect-ratio:1.22;background:#dedede;overflow:hidden}.thumb:before,.thumb:after{content:none}.thumb.alt,.thumb.crop{filter:none;background:#dedede}.post-actions{height:29px;padding:6px 8px;font-size:13px;letter-spacing:3px}.post-caption{padding:0 8px 9px;font-size:9px;line-height:1.45}.post-caption b{margin-right:4px}.trace-link,.ghost-post{display:none}
.trace-page{overflow:hidden}.back{position:fixed;right:28px;top:23px;z-index:10;border:0;background:none;font-size:12px;text-decoration:underline;text-underline-offset:4px}.map{position:absolute;inset:75px 4vw 42px;overflow:hidden}.connections{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.connection{fill:none;stroke:var(--blue);stroke-width:1.25;opacity:.48;stroke-dasharray:var(--length);stroke-dashoffset:var(--length);transition:stroke-dashoffset .55s ease}.connection.drawn{stroke-dashoffset:0}.node{position:absolute;width:clamp(98px,13vw,166px);background:#fff;border:1px solid #cfcfcf;box-shadow:0 4px 12px #0000000b;cursor:grab;touch-action:none;z-index:1;transition:transform .25s,border-color .25s,box-shadow .25s,opacity .45s}.node:hover{transform:translateY(-4px)}.node:not(.source){opacity:0;visibility:hidden;transform:scale(.94)}.node.revealed{opacity:1;visibility:visible;transform:scale(1)}.node.revealed:hover{transform:translateY(-3px)}.node.dragging,.node.dragging:hover{cursor:grabbing;transform:none;transition:border-color .25s,box-shadow .25s,opacity .45s;z-index:5}.node.selected{border:2px solid var(--blue);box-shadow:0 0 0 5px #3157ff18;z-index:4}.node.source{border-color:#111}.node .mini-head{height:18px;padding:4px 6px;display:flex;align-items:center;gap:4px;font-size:6px;color:#555}.mini-avatar{width:8px;height:8px;border-radius:50%;background:#c5c5c5}.node .thumb{aspect-ratio:1.12}.node .mini-foot{height:19px;padding:5px 6px;font-size:6px;color:#777;display:flex;justify-content:space-between}.node.source .mini-foot{color:#111}.node.source:after{content:"";position:absolute;top:100%;left:10px;font-size:8px;white-space:nowrap;color:#111}.node.source{outline:4px solid var(--lime);outline-offset:4px;transition:left .7s ease,top .7s ease,width .7s ease,transform .7s ease,border-color .25s,box-shadow .25s}.node.source.centered{left:50%;top:50%;transform:translate(-50%,-50%) scale(1.14);z-index:6}.p1{left:6%;top:62%}.p2{left:24%;top:43%}.p3{left:27%;top:76%}.p4{left:43%;top:27%}.p5{left:45%;top:53%}.p6{left:49%;top:80%}.p7{left:64%;top:18%}.p8{left:68%;top:43%}.p9{left:70%;top:68%}.p10{left:84%;top:36%}.p11{left:86%;top:60%}.source{left:3%;top:30%;width:clamp(108px,14vw,180px)}
.page-indicator{position:fixed;left:28px;bottom:22px;font-size:10px;color:#888;letter-spacing:.12em}.trace-hint{position:fixed;right:28px;bottom:20px;font-size:10px;color:#888}
@media(max-width:850px){.feed-grid{grid-template-columns:repeat(3,minmax(0,1fr));width:calc(100vw - 34px);gap:11px;margin-top:82px}}
@media(max-width:560px){.site-title{left:16px;top:14px}.feed-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:66px;width:calc(100vw - 24px);gap:9px}.back{right:16px;top:18px}.map{inset:68px 10px 55px}.node{width:clamp(76px,23vw,116px)}.source{width:clamp(86px,25vw,126px)}.p1{left:0;top:55%}.p2{left:24%;top:36%}.p3{left:22%;top:73%}.p4{left:45%;top:20%}.p5{left:44%;top:49%}.p6{left:47%;top:78%}.p7{left:67%;top:14%}.p8{left:68%;top:40%}.p9{left:69%;top:67%}.p10{left:82%;top:31%}.p11{left:81%;top:58%}.source{left:0;top:20%}.page-indicator{left:16px;bottom:14px}.trace-hint{right:16px;bottom:14px}}
</style>
</head>
<body>
<div class="site-title">Digital Landfill</div>
<main>
  <section class="page feed-page active" id="feed" aria-label="피드">
    <div class="feed-grid" id="feedGrid" aria-label="SNS 게시물 피드"></div>
    <div class="page-indicator">01 / 02</div>
  </section>
  <section class="page trace-page" id="trace" aria-label="게시물 추적">
    <button class="back" data-back>← 피드로</button>
    <div class="map">
      <svg class="connections" preserveAspectRatio="none" aria-hidden="true"></svg>
      <article class="node source" data-node="source"><div class="mini-head"><i class="mini-avatar"></i><span class="source-account">daily.archive</span></div><div class="thumb"></div><div class="mini-foot"><span>♡　↗</span><span>원본</span></div></article>
      <article class="node p1" data-node="p1"><div class="mini-head"><i class="mini-avatar"></i> post_01</div><div class="thumb"></div><div class="mini-foot"><span>♡　↗</span><span>재업로드</span></div></article>
      <article class="node p2" data-node="p2"><div class="mini-head"><i class="mini-avatar"></i> post_02</div><div class="thumb crop"></div><div class="mini-foot"><span>♡　↗</span><span>편집본</span></div></article>
      <article class="node p3" data-node="p3"><div class="mini-head"><i class="mini-avatar"></i> post_03</div><div class="thumb alt"></div><div class="mini-foot"><span>♡　↗</span><span>재업로드</span></div></article>
      <article class="node p4" data-node="p4"><div class="mini-head"><i class="mini-avatar"></i> post_04</div><div class="thumb crop"></div><div class="mini-foot"><span>♡　↗</span><span>편집본</span></div></article>
      <article class="node p5" data-node="p5"><div class="mini-head"><i class="mini-avatar"></i> post_05</div><div class="thumb"></div><div class="mini-foot"><span>♡　↗</span><span>재업로드</span></div></article>
      <article class="node p6" data-node="p6"><div class="mini-head"><i class="mini-avatar"></i> post_06</div><div class="thumb alt"></div><div class="mini-foot"><span>♡　↗</span><span>재업로드</span></div></article>
      <article class="node p7" data-node="p7"><div class="mini-head"><i class="mini-avatar"></i> post_07</div><div class="thumb"></div><div class="mini-foot"><span>♡　↗</span><span>편집본</span></div></article>
      <article class="node p8" data-node="p8"><div class="mini-head"><i class="mini-avatar"></i> post_08</div><div class="thumb crop"></div><div class="mini-foot"><span>♡　↗</span><span>재업로드</span></div></article>
      <article class="node p9" data-node="p9"><div class="mini-head"><i class="mini-avatar"></i> post_09</div><div class="thumb alt"></div><div class="mini-foot"><span>♡　↗</span><span>편집본</span></div></article>
      <article class="node p10" data-node="p10"><div class="mini-head"><i class="mini-avatar"></i> post_10</div><div class="thumb"></div><div class="mini-foot"><span>♡　↗</span><span>재업로드</span></div></article>
      <article class="node p11" data-node="p11"><div class="mini-head"><i class="mini-avatar"></i> post_11</div><div class="thumb crop"></div><div class="mini-foot"><span>♡　↗</span><span>재업로드</span></div></article>
    </div>
    <div class="page-indicator">02 / 02</div><div class="trace-hint">카드를 눌러 선택</div>
  </section>
</main>
<script>
const feed=document.getElementById('feed'),trace=document.getElementById('trace'),feedGrid=document.getElementById('feedGrid'),map=document.querySelector('.map'),lineLayer=document.querySelector('.connections');
const accounts=['daily.archive','another.day','slow.moment','ordinary.log','archive_02','today.record'];
const captions=['오늘의 기록','오래된 장면','그냥 지나친 순간','오늘도 같은 하루','기억하고 싶은 장면','어디서 본 것 같은 이미지'];
let postCount=0,loadingMore=false;
const links=[['source','p1'],['source','p2'],['source','p3'],['p1','p4'],['p2','p5'],['p3','p6'],['p4','p7'],['p5','p8'],['p6','p9'],['p7','p10'],['p8','p11']];
let revealTimer=null;
function appendPosts(amount=16){const fragment=document.createDocumentFragment();for(let i=0;i<amount;i++){const index=postCount++,account=accounts[index%accounts.length],card=document.createElement('article');card.className='post';card.dataset.account=account;card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`${account} 게시물 추적하기`);card.innerHTML=`<div class="post-head"><i class="avatar"></i><b>${account}</b><span class="more">•••</span></div><div class="thumb" aria-hidden="true"></div><div class="post-actions">♡　↗　▱</div><div class="post-caption"><b>${account}</b> ${captions[index%captions.length]}</div>`;card.addEventListener('click',()=>showTrace(card));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showTrace(card)}});fragment.append(card)}feedGrid.append(fragment)}
function nodeById(id){return document.querySelector(`[data-node="${id}"]`)}
function lineEnds(from,to){const r1=from.getBoundingClientRect(),r2=to.getBoundingClientRect(),rm=map.getBoundingClientRect(),x1=r1.left+r1.width/2-rm.left,y1=r1.top+r1.height/2-rm.top,x2=r2.left+r2.width/2-rm.left,y2=r2.top+r2.height/2-rm.top,dx=x2-x1,dy=y2-y1,t1=1/Math.max(Math.abs(dx)/(r1.width/2),Math.abs(dy)/(r1.height/2)),t2=1/Math.max(Math.abs(dx)/(r2.width/2),Math.abs(dy)/(r2.height/2));return{x1:x1+dx*t1,y1:y1+dy*t1,x2:x2-dx*t2,y2:y2-dy*t2}}
function updateLine(line){const a=nodeById(line.dataset.from),b=nodeById(line.dataset.to);if(!a||!b)return;const p=lineEnds(a,b),length=Math.hypot(p.x2-p.x1,p.y2-p.y1);line.setAttribute('x1',p.x1);line.setAttribute('y1',p.y1);line.setAttribute('x2',p.x2);line.setAttribute('y2',p.y2);line.style.setProperty('--length',length)}
function updateLinesFor(id){lineLayer.querySelectorAll('.connection').forEach(line=>{if(line.dataset.from===id||line.dataset.to===id)updateLine(line)})}
function animateConnections(){lineLayer.replaceChildren();lineLayer.setAttribute('viewBox',`0 0 ${map.clientWidth} ${map.clientHeight}`);document.querySelectorAll('.node:not(.source)').forEach(n=>{n.classList.remove('revealed','selected');n.style.left='';n.style.top=''});links.forEach(([from,to])=>{const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.classList.add('connection');line.dataset.from=from;line.dataset.to=to;lineLayer.append(line)});let step=0;function revealNext(){if(step>=links.length)return;const [from,to]=links[step],line=lineLayer.children[step],target=nodeById(to);if(!line||!target)return;updateLine(line);requestAnimationFrame(()=>{line.classList.add('drawn');target.classList.add('revealed')});step++;revealTimer=setTimeout(revealNext,320)}revealTimer=setTimeout(revealNext,100)}
function showTrace(card){clearTimeout(revealTimer);lineLayer.replaceChildren();document.querySelectorAll('.node:not(.source)').forEach(n=>{n.classList.remove('revealed','selected');n.style.left='';n.style.top=''});const source=nodeById('source');source.classList.remove('centered');document.querySelector('.source-account').textContent=card?.dataset.account||'daily.archive';source.classList.add('centered');feed.classList.remove('active');trace.classList.add('active');revealTimer=setTimeout(()=>{source.classList.remove('centered');revealTimer=setTimeout(animateConnections,740)},800)}function showFeed(){clearTimeout(revealTimer);trace.classList.remove('active');feed.classList.add('active')}
appendPosts(20);feed.addEventListener('scroll',()=>{if(loadingMore||feed.scrollTop+feed.clientHeight<feed.scrollHeight-360)return;loadingMore=true;appendPosts(16);loadingMore=false});
document.querySelector('[data-back]').addEventListener('click',showFeed);document.querySelectorAll('[data-node]').forEach(n=>{n.addEventListener('click',()=>{document.querySelectorAll('[data-node]').forEach(x=>x.classList.remove('selected'));n.classList.add('selected')});n.addEventListener('pointerdown',e=>{if(e.button!==0)return;const startX=e.clientX,startY=e.clientY,left=n.offsetLeft,top=n.offsetTop;n.classList.add('dragging');n.setPointerCapture(e.pointerId);function move(ev){const x=Math.max(0,Math.min(map.clientWidth-n.offsetWidth,left+ev.clientX-startX)),y=Math.max(0,Math.min(map.clientHeight-n.offsetHeight,top+ev.clientY-startY));n.style.left=`${x}px`;n.style.top=`${y}px`;updateLinesFor(n.dataset.node)}function finish(ev){n.classList.remove('dragging');n.releasePointerCapture(ev.pointerId);n.removeEventListener('pointermove',move);n.removeEventListener('pointerup',finish);n.removeEventListener('pointercancel',finish)}n.addEventListener('pointermove',move);n.addEventListener('pointerup',finish);n.addEventListener('pointercancel',finish)})});window.addEventListener('resize',()=>{lineLayer.setAttribute('viewBox',`0 0 ${map.clientWidth} ${map.clientHeight}`);lineLayer.querySelectorAll('.connection').forEach(updateLine)});document.addEventListener('keydown',e=>{if(e.key==='Escape')showFeed()});
</script>
</body>
</html>
